# /etc/nginx/sites-available/reybasar  
server {
    listen 80;
    server_name reybasar.mx www.reybasar.mx;

    client_max_body_size 40m;   # fotos desde el admin y el bot

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 800;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /static/ {
        alias /srv/reybasar/app/app/static/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        alias /srv/reybasar/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # la IA del admin tarda unos segundos
    }
}
