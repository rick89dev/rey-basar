<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato {{ c.folio }} · ReyBasar</title>
<meta name="robots" content="noindex">
<style>
  @page{size:letter;margin:18mm 16mm}
  body{max-width:760px;margin:0 auto;padding:20px}
  body{font-family:Georgia,"Times New Roman",serif;color:#111;font-size:13.5px;line-height:1.5}
  h1{font-size:18px;text-align:center;text-transform:uppercase;margin:0 0 4px;letter-spacing:.04em}
  .sub{text-align:center;margin:0 0 18px;color:#333}
  h2{font-size:14px;text-transform:uppercase;margin:16px 0 6px}
  table.art{width:100%;border-collapse:collapse;margin:8px 0}
  table.art th,table.art td{border:1px solid #444;padding:5px 7px;text-align:left;vertical-align:top}
  table.art th{background:#eee}
  td.n{text-align:right;white-space:nowrap}
  .linea{display:inline-block;min-width:240px;border-bottom:1px solid #000}
  table.firmas-t{width:100%;margin-top:40px;border-collapse:collapse}
  .firma-esp{height:80px;vertical-align:bottom;text-align:center;border-bottom:1px solid #000;width:45%}
  .firma-nom{text-align:center;padding-top:6px;width:45%}
  .sep{width:10%}
  .firma-img{max-height:75px;max-width:260px}
  .sello-firma{font-size:11px;color:#444;text-align:center;margin-top:14px}
  .barra{position:sticky;top:0;background:#fff6dd;border:1px solid #f2b630;padding:8px 12px;margin-bottom:16px;font-family:system-ui,sans-serif;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .barra a{font-weight:700;padding:8px 18px;background:#000;color:#fff;text-decoration:none}
  .aviso{font-size:12px;color:#444;border-top:1px solid #ccc;margin-top:20px;padding-top:8px}
  @media print{.barra,.aviso{display:none}body{padding:0}}
  table.lugar-fecha{width:100%;margin:0 0 14px;border-collapse:collapse}
  table.lugar-fecha td{padding:0}
  table.lugar-fecha td.der{text-align:right}
</style>
</head>
<body>
{% if not embed %}<div class="barra"><span>{% if c.firmado %}Contrato firmado.{% else %}Vista previa: revisa los datos antes de firmar.{% endif %}</span><a href="/admin/contratos/{{ c.id }}/pdf">⬇ Descargar PDF</a></div>{% endif %}
{% include "admin/_contrato_cuerpo.html" %}
<p class="aviso">Formato de referencia. Te recomendamos que un abogado lo revise antes de usarlo de forma definitiva.</p>
</body>
</html>
